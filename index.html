<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Phone runner v1.3</title>
<style>
:root{--bg:#141517;--panel:#1d1f22;--line:#313438;--txt:#e9eee6;--mut:#9ea6a0;--accent:#7fcf55;--prog:#f2a65a;--on:#0c1a06;--min:#3fb0a0;--est:#5a8fd0;--task:#7cc05a;--brk:#b58ad6;--warn:#e48a6a;--btn:#2a2d30;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 90px}
h2{font-size:1.05rem;margin:0 0 8px;color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
button,select,input{font:inherit;color:var(--txt)}
button{min-height:48px;padding:6px 14px;margin:3px 3px 3px 0;background:var(--btn);border:0;border-radius:8px}
button:active{filter:brightness(.8)} button:disabled{opacity:.4}
button.pri{background:var(--accent);color:var(--on);font-weight:600}
input,select{max-width:100%;min-height:44px;padding:4px 8px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
input[type=number]{width:72px}
.seg2{display:flex;margin-bottom:8px}.seg2 button{flex:1;margin:0;border-radius:0}
.seg2 button:first-child{border-radius:8px 0 0 8px}.seg2 button:last-child{border-radius:0 8px 8px 0}
.seg2 button.on{background:var(--accent);color:var(--on);font-weight:600}
.mut{color:var(--mut);font-size:.85rem}
.chip{display:inline-block;padding:0 8px;border-radius:10px;font-size:.75rem;color:#0c1208;vertical-align:middle}
.cur{border:2px solid var(--accent)}
.name{font-size:1.7rem;font-weight:700;line-height:1.2;margin:4px 0}
.big{font-size:3rem;font-weight:800;line-height:1.1}
.ends{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.nowbig{font-size:1.4rem;font-weight:600}.endbig{font-size:2.1rem;font-weight:800;line-height:1.1;text-align:right}
.late{color:var(--warn)}.early{color:var(--brk)}
.bar-wrap{position:relative;padding:4px 6px;margin:4px 0 8px}
.bar{position:relative;height:48px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.s{position:absolute;top:0;bottom:0;min-width:3px;overflow:hidden;box-shadow:inset -1px 0 0 var(--bg)}
.s.past::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:var(--bg);opacity:.6;pointer-events:none}.s.now{box-shadow:inset 0 0 0 3px var(--txt),inset -1px 0 0 var(--bg)}
.s.partial{background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.35) 0 3px,transparent 3px 6px)}
.s .fill{position:absolute;left:0;top:0;bottom:0;background:#000;opacity:.3}
.s.grey{background:repeating-linear-gradient(135deg,#3a3d40 0 4px,#2c2f32 4px 8px)!important}.s.rem{opacity:.55}
#preset{width:100%;text-overflow:ellipsis}.row input[type=checkbox]{width:26px;height:26px;margin:4px}
.mk{position:absolute;top:0;bottom:0;width:0;pointer-events:none}
.mk.nowm{border-left:2px solid var(--txt)}.mk.orig{border-left:2px dashed var(--mut)}.mk.endm{border-left:4px solid var(--accent)}
.mk.endm.late{border-left-color:var(--warn)}.mk.endm.early{border-left-color:var(--brk)}
.detail{background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.9rem}.detail:empty{display:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--mut);margin-top:6px}
.row{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row.dim{color:var(--mut)}
.row .main{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.row .tm{font-size:.85rem;color:var(--mut)}
.arrow{width:44px;min-height:44px;margin:0;padding:0}
.mks{position:absolute;left:7px;right:7px;top:0;bottom:0;pointer-events:none}
.mk.due{border-left:3px solid #e5484d}
button.tg.on{background:var(--accent);color:var(--on);font-weight:600}
.rrow{gap:5px;padding:3px 0}
.arrows{display:flex;flex-direction:column;flex:none}
.arrows button{width:34px;height:22px;min-height:22px;margin:0;padding:0;font-size:.7rem;line-height:1;border-radius:4px}
.rrow input.rn{flex:1;min-width:0;width:auto;min-height:40px}
.rrow input.rd{width:50px;min-height:40px;padding:4px}
.rrow .dq{background:#e5484d;color:#fff;font-weight:600;flex:none;min-height:40px;margin:0;padding:0 8px}
.rwrap{border-top:1px solid var(--line)}.rwrap:first-child{border-top:0}
.rrow .u{font-size:.7rem;color:var(--mut)}
.tsel{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:40px;border-radius:6px;color:#0c1208;font-size:1.1rem}
.tsel select{position:absolute;left:0;top:0;width:100%;height:100%;min-height:0;opacity:0;padding:0}
.ed{padding:8px 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.ed label{display:flex;flex-direction:column;font-size:.75rem;color:var(--mut)}
.banner{background:#33261a;border:1px solid var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.9rem}.banner:empty{display:none}.banner button{margin-top:6px}
.info h3{font-size:.95rem;margin:14px 0 4px;color:var(--txt)}.info p,.info li{font-size:.9rem;margin:4px 0}.info ul{padding-left:20px;margin:4px 0}
#log{font:.8rem/1.5 monospace;white-space:pre-wrap;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{margin:0;border-radius:0;min-height:56px;background:transparent}
nav button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<div id="banner" class="banner"></div>
<div id="setup" class="card">
  <h2>Start a run</h2>
  <label>Routine <select id="preset"></select></label><br>
  
  <div class="seg2" style="margin-top:8px"><button id="mReq" type="button">Required end time</button><button id="mOpen" type="button">Open-ended</button></div>
  <div id="reqBox">
    <label>Length <input type="number" id="lenH" min="0"> hr <input type="number" id="lenM" min="0"> min</label><br>
    <label>Ends at <input type="time" id="endT"></label> <button type="button" class="tg" id="recBtn">Recommended</button>
  </div>
  <div id="openBox" class="mut"></div>
  <button class="pri" type="button" id="startBtn" style="margin-top:8px">Start run</button>
  <div id="setupErr" class="late"></div>
  <hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><h2>Backup</h2>
  <button type="button" onclick="exportAll()">Copy export</button> <input id="impBox" placeholder="Paste an export here"> <button type="button" onclick="importAll()">Import</button>
  <div class="mut" id="backupMsg"></div><textarea id="expFb" readonly style="display:none;width:100%;height:80px"></textarea>
</div>
<div id="app"></div>
</div>
<nav id="nav" style="display:none"><button id="tRun" type="button">Run</button><button id="tEdit" type="button">Edit routine</button><button id="tTasks" type="button">Tasks</button></nav>
<script id="engine">
const ENGINE = (function () {
  const FLOOR_FRACTION = 0.8;   // min / est items compress to this share of their remaining time
  const GROW_WEIGHT_MIN = 5;    // buffers grow in proportion to max(default, this)
  const BUFFER_MIN_SHOW = 1;    // a buffer shorter than this (minutes) is not shown
  const EPS = 1e-9;

  const clone = o => JSON.parse(JSON.stringify(o));
  const sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);
  const isBuf = it => it.type === 'buf';
  const spentOf = (it, now) => it.spent + (it.status === 'active' ? Math.max(0, now - it.activeSince) : 0);
  // A block always gets its full planned length: time spent in earlier (pushed-forward) blocks is not credited.
  const baseRemaining = (it, now) => Math.max(0, it.dur - (it.status === 'active' ? Math.max(0, now - it.activeSince) : 0));
  const totalPlanned = s => sum(s.items, i => i.dur);
  // Required mode: the fixed end. Open mode: start + everything planned (moves when items are added or removed).
  const referenceEnd = s => s.mode === 'required' ? s.requiredEnd : s.start + totalPlanned(s);
  const activeItem = s => s.items.find(i => i.status === 'active') || null;
  const byId = (s, id) => s.items.find(i => i.id === id);

  function makeItem(s, spec) {
    s.nextId = (s.nextId || 0) + 1;
    const type = spec.type;
    return {
      id: 'i' + s.nextId, type, kind: type === 'buf' ? (spec.kind || 'task') : 'work',
      name: spec.name, dur: spec.dur, src: spec.uid || null, status: 'pending', spent: 0, activeSince: null, lockedEnd: null
    };
  }

  function createRun(cfg) {
    const s = { mode: cfg.mode, start: cfg.start, requiredEnd: cfg.mode === 'required' ? cfg.requiredEnd : null,
                items: [], history: [], nextId: 0, finished: false, free: null };
    cfg.items.forEach(spec => s.items.push(makeItem(s, spec)));
    return activateNext(s, cfg.start);
  }

  /* ---------- layout ----------
     Lays out every not-yet-finished item from `now`.
     Required: slack = (end - now) - work - buffer defaults.
       slack >= 0: buffers grow by weight max(default, 5), no cap. No buffers: saved time (free tail).
       slack <  0: buffers shrink in proportion to default, then items compress to 80%,
                   then the projected end runs past the required end.
     Open: same, except items never compress; past the buffers the projected end moves later.
     Buffers that would be shorter than BUFFER_MIN_SHOW disappear (the active one never does). */
  function layout(s, now) {
    const live = s.items.filter(i => i.status === 'pending' || i.status === 'active');
    const info = live.map(it => ({ it, base: baseRemaining(it, now), len: 0, hidden: false, live: true }));
    const fx = info.find(x => x.it.status === 'active' && x.it.lockedEnd !== null && x.it.lockedEnd !== undefined);
    if (fx) { fx.base = Math.max(0, fx.it.lockedEnd - now); fx.len = fx.base; }
    const W = info.filter(x => x !== fx && !isBuf(x.it));
    const B = info.filter(x => x !== fx && isBuf(x.it));
    const Wsum = sum(W, x => x.base);
    const ref = referenceEnd(s);
    const A = ref - now - (fx ? fx.len : 0);

    for (;;) {
      const liveB = B.filter(x => x.live);
      const Bdef = sum(liveB, x => x.base);
      const slack = A - Wsum - Bdef;
      W.forEach(x => { x.len = x.base; });
      if (slack >= 0) {
        if (liveB.length) {
          const wts = liveB.map(x => Math.max(x.base, GROW_WEIGHT_MIN));
          const wsum = sum(wts, w => w);
          liveB.forEach((x, i) => { x.len = x.base + slack * wts[i] / wsum; });
        }
      } else {
        const deficit = -slack;
        if (deficit <= Bdef + EPS) {
          liveB.forEach(x => { x.len = Bdef > EPS ? x.base * (1 - deficit / Bdef) : 0; });
        } else {
          liveB.forEach(x => { x.len = 0; });
          const d2 = deficit - Bdef;
          if (s.mode === 'required') {
            const comp = sum(W, x => (1 - FLOOR_FRACTION) * x.base);
            if (comp > EPS) {
              const f = Math.min(1, d2 / comp);
              W.forEach(x => { x.len = x.base - (1 - FLOOR_FRACTION) * x.base * f; });
            }
          }
        }
      }
      const tiny = liveB.filter(x => x.len < BUFFER_MIN_SHOW && x.it.status !== 'active');
      if (!tiny.length) break;
      tiny.forEach(x => { x.live = false; x.len = 0; x.hidden = true; });
    }

    let t = now;
    const blocks = info.map(x => {
      const start = t; t += x.len;
      const blk = { id: x.it.id, name: x.it.name, type: x.it.type, kind: x.it.kind, status: x.it.status,
               start, end: t, len: x.len, base: x.base, hidden: x.hidden };
      // Single chime when TOTAL time on a minimum item reaches its minimum (null if already reached)
      if (x.it.status === 'active') blk.minChimeAt = (x.it.type === 'min' && x.it.spent < x.it.dur - EPS) ? x.it.activeSince + (x.it.dur - x.it.spent) : null;
      return blk;
    });
    const projectedEnd = t;
    return {
      mode: s.mode, now, blocks, projectedEnd, referenceEnd: ref,
      overBy: Math.max(0, projectedEnd - ref),
      freeTail: Math.max(0, ref - projectedEnd),
      history: s.history.slice(),
      freeBlock: s.free ? { start: s.free.since, end: Math.max(ref, now) } : null,
      endReached: now >= ref - 0.05
    };
  }

  // Fixes the active block's end at the moment of an event; only events change it.
  function relock(s, now) {
    const a = activeItem(s); if (!a || now === undefined) return s;
    a.lockedEnd = null;
    const b = layout(s, now).blocks.find(x => x.id === a.id);
    a.lockedEnd = now + (b ? b.len : a.dur);
    return s;
  }

  /* ---------- events (each returns { state, error }) ---------- */
  function activateNext(s, now) {
    const lay = layout(s, now);
    let activated = false;
    for (const b of lay.blocks) {
      const it = byId(s, b.id);
      if (b.hidden) { it.status = 'skipped'; continue; }     // hidden buffers up to the next visible item are passed over
      it.status = 'active'; it.activeSince = now; relock(s, now); activated = true; break;
    }
    if (!activated) {
      s.items.forEach(i => { if (i.status === 'pending') i.status = 'skipped'; });
      if (now < referenceEnd(s) - 0.05) s.free = { since: now };   // saved time keeps running until exit or the end time
      else s.finished = true;
    }
    return s;
  }

  function finishRun(state, now) {
    const s = clone(state);
    if (!s.free) return { state: s, error: 'not in saved time' };
    s.history.push({ free: true, name: 'Saved time', from: s.free.since, to: now });
    s.free = null; s.finished = true;
    return { state: s, error: null };
  }

  function complete(state, now) {
    const s = clone(state);
    const act = activeItem(s);
    if (!act) return { state: s, error: 'no active item' };
    act.spent = spentOf(act, now);
    s.history.push({ id: act.id, name: act.name, from: act.activeSince, to: now, partial: false });
    act.squeezed = !!act.squeezed || (act.lockedEnd != null && act.lockedEnd - act.activeSince < act.dur - 0.05);
    act.status = 'done'; act.activeSince = null;
    activateNext(s, now);
    return { state: s, error: null };
  }

  // Skips the active item one position, for this run only. Time already spent stays on the
  // item (and on the timeline as a partial block) and counts against it when it comes up again.
  function pushForward(state, now) {
    const s = clone(state);
    const idx = s.items.findIndex(i => i.status === 'active');
    if (idx < 0) return { state: s, error: 'no active item' };
    const hidden = new Set(layout(s, now).blocks.filter(b => b.hidden).map(b => b.id));
    let j = -1;
    for (let k = idx + 1; k < s.items.length; k++) {
      if (s.items[k].status === 'pending' && !hidden.has(s.items[k].id)) { j = k; break; }
    }
    if (j < 0) return { state: s, error: 'nothing to push past' };
    const act = s.items[idx];
    act.spent = spentOf(act, now);
    s.history.push({ id: act.id, name: act.name, from: act.activeSince, to: now, partial: true });
    act.squeezed = !!act.squeezed || (act.lockedEnd != null && act.lockedEnd - act.activeSince < act.dur - 0.05);
    act.status = 'pending'; act.activeSince = null;
    for (let k = idx + 1; k < j; k++) if (s.items[k].status === 'pending') s.items[k].status = 'skipped';
    s.items.splice(idx, 1);          // target is now at j - 1
    s.items.splice(j, 0, act);       // pushed item lands right after it
    const target = s.items[j - 1];
    target.status = 'active'; target.activeSince = now; relock(s, now);
    return { state: s, error: null };
  }

  /* ---------- mid-run edits: only items that have not started ---------- */
  function frontier(s) {
    const k = s.items.findIndex(i => i.status === 'pending');
    return k < 0 ? s.items.length : k;
  }
  function addItem(state, spec, atIndex, now) {
    const s = clone(state);
    if (s.finished) return { state: s, error: 'run finished' };
    const idx = Math.max(atIndex === undefined ? s.items.length : atIndex, frontier(s));
    s.items.splice(Math.min(idx, s.items.length), 0, makeItem(s, spec));
    if (s.free) { s.history.push({ free: true, name: 'Saved time', from: s.free.since, to: now }); s.free = null; activateNext(s, now); } else relock(s, now);
    return { state: s, error: null };
  }
  function deleteItem(state, id, now) {
    const s = clone(state);
    const it = byId(s, id);
    if (!it) return { state: s, error: 'no such item' };
    if (it.status !== 'pending') return { state: s, error: 'only items not yet started can be deleted' };
    s.items = s.items.filter(i => i.id !== id); relock(s, now);
    return { state: s, error: null };
  }
  function moveItem(state, id, dir, now) {
    const s = clone(state);
    const k = s.items.findIndex(i => i.id === id);
    if (k < 0) return { state: s, error: 'no such item' };
    if (s.items[k].status !== 'pending') return { state: s, error: 'only items not yet started can be moved' };
    const k2 = k + (dir < 0 ? -1 : 1);
    if (k2 >= 0 && s.items[k2] && s.items[k2].status === 'active') {   // Up on the first waiting item = push forward
      if (dir >= 0 || now === undefined) return { state: s, error: 'cannot move there' };
      const r = pushForward(state, now);
      return (r.error || activeItem(r.state).id !== id) ? { state: s, error: r.error || 'cannot move there' } : r;
    }
    if (k2 < 0 || k2 >= s.items.length || s.items[k2].status !== 'pending') return { state: s, error: 'cannot move there' };
    [s.items[k], s.items[k2]] = [s.items[k2], s.items[k]]; relock(s, now);
    return { state: s, error: null };
  }
  // patch may hold name, dur; type/kind only for items not yet started. The active item keeps its time spent.
  function updateItem(state, id, patch, now) {
    const s = clone(state);
    const it = byId(s, id);
    if (!it) return { state: s, error: 'no such item' };
    if (it.status !== 'pending' && it.status !== 'active') return { state: s, error: 'finished items cannot be edited' };
    if (patch.name !== undefined) it.name = patch.name;
    if (patch.dur !== undefined) it.dur = patch.dur;
    if (it.status === 'pending') {
      if (patch.type !== undefined) it.type = patch.type;
      if (patch.kind !== undefined) it.kind = patch.kind;
      it.kind = it.type === 'buf' ? (it.kind === 'break' ? 'break' : 'task') : 'work';
    }
    relock(s, now);
    return { state: s, error: null };
  }

  /* ---------- readable dump ---------- */
  const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
  function describe(lay, s) {
    const lines = [];
    (s ? s.history : lay.history).forEach(h => lines.push(`  past   ${h.name}: ${f1(h.from)} to ${f1(h.to)}${h.partial ? ' (partial, pushed)' : ''}`));
    lay.blocks.forEach(b => {
      if (b.hidden) { lines.push(`  hidden ${b.name} (${b.kind})`); return; }
      lines.push(`  ${b.status === 'active' ? 'now   ' : 'next  '} ${b.name}${b.type === 'buf' ? ' [' + b.kind + ' buffer]' : ''}: ${f1(b.start)} to ${f1(b.end)} (${f1(b.len)} min)`);
    });
    lines.push(`  projected end ${f1(lay.projectedEnd)}, reference end ${f1(lay.referenceEnd)}` +
      (lay.overBy > 1e-6 ? `, OVER by ${f1(lay.overBy)}` : '') + (lay.freeTail > 1e-6 ? `, saved tail ${f1(lay.freeTail)}` : ''));
    return lines.join('\n');
  }

  return { createRun, layout, complete, finishRun, pushForward, addItem, deleteItem, moveItem, updateItem,
           activeItem, describe, constants: { FLOOR_FRACTION, GROW_WEIGHT_MIN, BUFFER_MIN_SHOW } };
})();
</script>
<script id="ui">
const E = ENGINE, $ = id => document.getElementById(id);
const CLOCK_24H = false;
const fm = n => String(Math.round(n));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const clone = o => JSON.parse(JSON.stringify(o));
/* ---------- versions and multi-tab safety ----------
   APP_VERSION is shown to the person. SCHEMA is the saved-data format: only bump it for a change an older
   copy cannot safely read or write (renamed or removed fields). Adding optional fields keeps the same SCHEMA.
   Saving is switched off (LOCK) in a tab when the saved data was written by another tab or by a newer
   SCHEMA, so a stale tab never overwrites newer data. */
const APP_VERSION = '1.3', SCHEMA = 1, TAB_ID = Math.random().toString(36).slice(2, 10);
let LOCK = null, lastSaved = '', ALIVE_NOTE = false, CONVERTED_NOTE = '';
const pad = n => String(n).padStart(2, '0');
const fmTotal = m => { const r = Math.round(m); return r < 60 ? r + ' min' : Math.floor(r / 60) + ' h ' + (r % 60) + ' min'; };
const itemsTotal = items => items.reduce((a, i) => a + (+i.dur || 0), 0);
let MUTED = false, actx = null, T0 = 0, DETAIL = null, ROUTINES = defaultRoutines(), RID = 'sprint', RDEL = null, runGain = null, armedSig = '', wake = null, lastWake = 0, impPending = false, lastEdit = 'len';
function defaultRoutines() { return [
  { id: 'sprint', name: 'Sprint', mode: 'required', items: [{ type: 'buf', kind: 'task', name: 'Task time', dur: 0 }] },
  { id: 'morning', name: 'Morning (example)', mode: 'open', items: [

function rMove(i, d) { RDELI = null; const a = rt().items, j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; render(); }

function rAdd(at) { RDELI = null; const a = rt().items, k = (at === undefined || at > a.length) ? a.length : at; a.splice(k, 0, { type: 'est', name: 'New item', dur: 5 }); render(); const ns = document.querySelectorAll('.rn'); if (ns[k]) { ns[k].focus(); ns[k].select(); } }
function rRename(v) { rt().name = v.trim() || 'Routine'; render(); }
function rMode(v) { rt().mode = v; save(); }
function rNew() { const r = { id: 'r' + Date.now(), name: 'New routine', mode: 'required', items: [] }; ROUTINES.push(r); RID = r.id; render(); }
function rRemove() { const r = rt(); if (r.id === 'sprint') return; if (RDEL !== r.id) { RDEL = r.id; render(); return; } ROUTINES = ROUTINES.filter(x => x.id !== r.id); RID = 'sprint'; RDEL = null; render(); }

/* ---------- backup ---------- */
const EXP = 'PHONERUNNER_EXPORT_V1:';
function exportAll() { const t = EXP + JSON.stringify({ sv: SCHEMA, ver: APP_VERSION, routines: ROUTINES, tasks: TASKS, habits: HABITS, day: DAY }), fb = $('expFb'), m = $('backupMsg');
  const show = () => { fb.value = t; fb.style.display = 'block'; fb.select(); m.textContent = 'Clipboard unavailable: select and copy the text below.'; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => { fb.style.display = 'none'; m.textContent = 'Copied export to clipboard.'; }, show); else show(); }
function importAll() { const v = $('impBox').value.trim(), m = $('backupMsg'); let d;
  if (!v.startsWith(EXP)) { m.textContent = 'That is not an export.'; return; }
  try { d = JSON.parse(v.slice(EXP.length)); } catch (e) { m.textContent = 'Could not read that export.'; return; }
  if (d && (d.sv || 1) > SCHEMA) { m.textContent = 'That export is from a newer version (' + (d.ver || '?') + ') and this one (v' + APP_VERSION + ') cannot read it safely.'; return; }
  if (!d || !Array.isArray(d.routines) || !Array.isArray(d.tasks) || !Array.isArray(d.habits)) { m.textContent = 'The export is incomplete.'; return; }
  if (!impPending) { impPending = true; m.textContent = 'This replaces all routines, tasks and habits. Tap Import again to confirm.'; return; }
  impPending = false; ROUTINES = d.routines.some(r => r.id === 'sprint') ? d.routines : [defaultRoutines()[0], ...d.routines];
  TASKS = d.tasks; HABITS = d.habits; DAY = d.day || 1; taskSeq = Math.max(0, ...TASKS.map(t => t.id)); habitSeq = Math.max(0, ...HABITS.map(h => h.id)); RID = 'sprint';
  $('impBox').value = ''; m.textContent = 'Imported.'; render(); }

/* ---------- saved data (survives reload and browser close) ---------- */
function save() { if (LOCK) return; try {
    const str = JSON.stringify({ sv: SCHEMA, ver: APP_VERSION, state, T0, base, BP, skip: [...SKIP], mom: RUNMOM, tasks: TASKS, habits: HABITS, day: DAY, ts: taskSeq, hs: habitSeq, routines: ROUTINES, rid: RID, muted: MUTED });
    if (str === lastSaved) return; localStorage.setItem('pr_v1', str); lastSaved = str; } catch (e) {} }
function restore() { const raw = localStorage.getItem('pr_v1'); const d = JSON.parse(raw || 'null'); if (!d) return;
  const sv = d.sv || 1;
  if (sv > SCHEMA) { LOCK = { kind: 'newer', ver: d.ver || '?' }; return; } // written by a newer version: read nothing, change nothing
  if (sv < SCHEMA) CONVERTED_NOTE = 'Your saved data was converted from an older format. Copy an export from the start screen if you want a backup.';
  state = d.state || null; T0 = d.T0 || 0; base = d.base || 0; BP = d.BP || null; SKIP = new Set(d.skip || []); RUNMOM = d.mom || 0; TASKS = d.tasks || []; HABITS = d.habits || [];
  DAY = d.day || 1; taskSeq = d.ts || 0; habitSeq = d.hs || 0; if (d.routines && d.routines.length) ROUTINES = d.routines; RID = d.rid || 'sprint'; MUTED = !!d.muted; }

/* ---------- other tabs and versions ---------- */
function bannerHTML() {
  let h = '';
  if (LOCK && LOCK.kind === 'newer') h += `<div><b>Saved data is from a newer version (${esc(LOCK.ver)}).</b> This is v${APP_VERSION}; it can't read that data safely, so it is not loading or saving anything. Reload to get the newer page.<br><button class="pri" onclick="location.reload()">Reload</button></div>`;
  else if (LOCK) h += `<div><b>Saved data was changed in another tab or version${LOCK.ver ? ' (' + esc(LOCK.ver) + ')' : ''}.</b> This tab has stopped saving so it doesn't overwrite that. If a routine is running here it keeps running, but its progress is not saved.<br><button class="pri" onclick="location.reload()">Reload to use the saved data</button><button onclick="keepThisTab()">Keep this tab's data</button></div>`;
  if (ALIVE_NOTE) h += `<div style="margin-top:8px"><b>A routine seems to be running in another tab.</b> Using both at once can overwrite each other's progress. Close one of them.<br><button onclick="ALIVE_NOTE=false;render()">Dismiss</button></div>`;
  if (CONVERTED_NOTE) h += `<div style="margin-top:8px">${esc(CONVERTED_NOTE)}<br><button onclick="CONVERTED_NOTE='';render()">Dismiss</button></div>`;
  return h;
}
function keepThisTab() { LOCK = null; lastSaved = ''; render(); }
window.addEventListener('storage', e => {
  if (e.key === 'pr_v1') {
    if (e.newValue === lastSaved) return;
    let nv = null; try { nv = JSON.parse(e.newValue || 'null'); } catch (x) {}
    if (LOCK && LOCK.kind === 'newer') return;
    LOCK = (nv && (nv.sv || 1) > SCHEMA) ? { kind: 'newer', ver: nv.ver || '?' } : { kind: 'other', ver: nv && nv.ver ? 'v' + nv.ver : '' };
    render();
  } else if (e.key === 'pr_v1_alive' && e.newValue && state && !state.finished) {
    try { if (JSON.parse(e.newValue).id !== TAB_ID) { ALIVE_NOTE = true; render(); } } catch (x) {}
  }
});
// A running tab writes a heartbeat so a second tab or a newer page can notice it. (Pages older than v1.2.3 do not.)
function beat() { try {
  if (state && !state.finished && !LOCK) localStorage.setItem('pr_v1_alive', JSON.stringify({ id: TAB_ID, ver: APP_VERSION, at: Date.now() }));
  else { const a = JSON.parse(localStorage.getItem('pr_v1_alive') || 'null'); if (a && a.id === TAB_ID) localStorage.removeItem('pr_v1_alive'); } } catch (e) {} }
try { const a = JSON.parse(localStorage.getItem('pr_v1_alive') || 'null'); if (a && a.id !== TAB_ID && Date.now() - a.at < 6000) ALIVE_NOTE = true; } catch (e) {}
setInterval(beat, 2000);
window.addEventListener('pagehide', () => { try { const a = JSON.parse(localStorage.getItem('pr_v1_alive') || 'null'); if (a && a.id === TAB_ID) localStorage.removeItem('pr_v1_alive'); } catch (e) {} });

/* ---------- info page ---------- */
function infoView() {
  return `<div class="card info"><h2>How to use</h2>
<h3>Run a routine</h3><ul>
<li>On the Run tab choose a routine, then either a required end time (blocks shrink to fit) or open-ended (the end moves later if you run long). Tap Start run.</li>
<li>Tap Done when an item is finished, or Push forward to skip it once for this run only. A chime sounds when an item's time is up, and once more 30 seconds later.</li>
<li>Estimate and Minimum items are fixed-length (a Minimum chimes once when its time is reached). Task buffers fill spare time with tasks and habits; break buffers are for rests. Buffers shrink first when you run late and grow when you are ahead.</li>
<li>When a run finishes, estimate items and habits you finished with Done in a task buffer offer Keep, Update or Split for their length, based on the time they took (time from pushed-forward blocks counts). Update and Split change the saved routine or habit.</li></ul>
<h3>Edit routines</h3><ul>
<li>The Edit routine tab changes the saved routines. During a run it edits only the items that have not started yet.</li>
<li>Use the arrows to reorder. Tap the coloured icon to change an item's type or delete it.</li></ul>
<h3>Tasks and habits</h3><ul>
<li>Add tasks by name; you will be asked for a length, urgency and importance. Habits come back on their own schedule (X times in Y days, at least Z days apart). New day advances the day counter.</li></ul>
<h3>Your data</h3><ul>
<li>Everything is stored only in this browser on this device. It is not sent anywhere or synced. Clearing site data, or using another browser or device, starts you from empty.</li>
<li>Back up often: on the start screen (no run in progress) use Copy export, and Import to restore.</li></ul>
<h3>Versions</h3><ul>
<li>This is v${APP_VERSION}. The hosted page can change at any time, and there is no guarantee a future version will work with older saves or exports, though I will try.</li>
<li>Avoid having the app open in two tabs at once. If a tab notices the saved data was changed elsewhere it stops saving and says so.</li></ul>
<button onclick="go('edit')" style="width:100%">Back to Edit routine</button></div>`;
}

/* ---------- alerts: scheduled on the audio clock, so they sound with the page in the background ---------- */
function chimeAtT(out, t, n) { const o = (f, tt, dur, vol) => { const c = actx.createOscillator(), g = actx.createGain(); c.type = 'sine'; c.frequency.value = f;
    g.gain.setValueAtTime(0.0001, tt); g.gain.exponentialRampToValueAtTime(vol, tt + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, tt + dur); c.connect(g); g.connect(out); c.start(tt); c.stop(tt + dur + 0.05); };
  if (n === 1) { o(659.25, t, 0.5, 0.2); return; } o(330, t, 0.55, 0.07); [659.25, 783.99, 987.77].forEach((f, i) => o(f, t + 0.6 + i * 0.28, 0.5, 0.25)); }
function alertTimes(lay) {
  const act = E.activeItem(state), b = act && lay.blocks.find(x => x.id === act.id); if (!act || !b) return [];
  const T = m => T0 + m * 60000, out = []; let end = act.lockedEnd;
  if (b.minChimeAt != null) out.push({ t: T(b.minChimeAt), n: 1 });
  if (BP && BP.bufId === act.id && BP.cur) end = Math.min(end, BP.cur.start + BP.cur.duration);
  if (end != null) { out.push({ t: T(end), n: 3 }); out.push({ t: T(end) + 30000, n: 3 }); } // the first chime and one repeat, no more
  return out;
}
function armAlerts(lay) {
  const times = alertTimes(lay), sig = MUTED + '|' + (actx ? actx.state : '') + '|' + times.map(x => Math.round(x.t / 1000) + ':' + x.n).join(',');
  if (sig === armedSig) return; armedSig = sig;
  if (runGain) { try { runGain.gain.value = 0; runGain.disconnect(); } catch (e) {} runGain = null; }
  if (MUTED || !times.length || !actx) return;
  try { runGain = actx.createGain(); runGain.connect(actx.destination);
    times.forEach(x => { const d = (x.t - Date.now()) / 1000; if (d > 0.2) chimeAtT(runGain, actx.currentTime + d, x.n); }); } catch (e) {} // alerts already past are never played
}
async function syncWake() {
  const want = !!state && !state.finished;
  if (want && !wake && document.visibilityState === 'visible' && navigator.wakeLock && Date.now() - lastWake > 5000) {
    lastWake = Date.now(); try { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } catch (e) {} }
  else if (!want && wake) { try { await wake.release(); } catch (e) {} wake = null; }
}

function render() {
  ensureUids(); syncNow(); const setupOn = !state && tab === 'run';
  $('setup').style.display = setupOn ? 'block' : 'none'; $('nav').style.display = 'grid';
  $('tRun').className = tab === 'run' ? 'on' : ''; $('tEdit').className = tab === 'edit' ? 'on' : ''; $('tTasks').className = tab === 'tasks' ? 'on' : '';
  if (setupOn) populateSetup();
  let html = '';
  if (state) { ensureBP(); const lay = E.layout(state, now); PLANS = bufferPlans(lay); armAlerts(lay); html = tab === 'info' ? infoView() : tab === 'run' ? runView(lay) : tab === 'edit' ? editView(lay) : tasksView(); }
  else html = tab === 'info' ? infoView() : tab === 'tasks' ? tasksView() : tab === 'edit' ? routineEditor() : '';
  $('banner').innerHTML = bannerHTML();
  $('app').innerHTML = (flashMsg ? `<div class="card late">${esc(flashMsg)}</div>` : '') + html; flashMsg = '';
  if (DETAIL && $('detail')) $('detail').textContent = DETAIL;
  save(); syncWake();
}
$('tRun').onclick = () => go('run'); $('tEdit').onclick = () => go('edit'); $('tTasks').onclick = () => go('tasks');
try { restore(); } catch (e) {}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
// Select-on-focus: duration boxes select their number; a name box still holding the "New item" placeholder selects it.
document.addEventListener('focusin', e => { const el = e.target;
  if (!el || el.tagName !== 'INPUT') return;
  const hit = el.classList.contains('rd') || (el.classList.contains('rn') && el.value === 'New item');
  if (hit) setTimeout(() => { try { el.select(); } catch (x) {} }, 0); });
document.addEventListener('pointerdown', () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state !== 'running') actx.resume(); } catch (e) {} }, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { syncWake(); if (state) render(); } });
const typing = () => { const a = document.activeElement; return !!a && $('app').contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); };
setInterval(() => { if (state && (tab === 'run' || (tab === 'edit' && !typing()))) render(); else if (!state && tab === 'run') syncSetup(); }, 1000);
setMode(rt().mode || 'required');
render();
</script>
