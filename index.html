<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Phone runner - Mockup 4</title>
<style>
:root{--bg:#141517;--panel:#1d1f22;--line:#313438;--txt:#e9eee6;--mut:#9ea6a0;--accent:#7fcf55;--prog:#f2a65a;--on:#0c1a06;--min:#3fb0a0;--est:#5a8fd0;--task:#7cc05a;--brk:#b58ad6;--warn:#e48a6a;--btn:#2a2d30;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 90px}
h2{font-size:1.05rem;margin:0 0 8px;color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
button,select,input{font:inherit;color:var(--txt)}
button{min-height:48px;padding:6px 14px;margin:3px 3px 3px 0;background:var(--btn);border:0;border-radius:8px}
button:active{filter:brightness(.8)} button:disabled{opacity:.4}
button.pri{background:var(--accent);color:var(--on);font-weight:600}
input,select{max-width:100%;min-height:44px;padding:4px 8px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
input[type=number]{width:72px}
.seg2{display:flex;margin-bottom:8px}.seg2 button{flex:1;margin:0;border-radius:0}
.seg2 button:first-child{border-radius:8px 0 0 8px}.seg2 button:last-child{border-radius:0 8px 8px 0}
.seg2 button.on{background:var(--accent);color:var(--on);font-weight:600}
.mut{color:var(--mut);font-size:.85rem}
.chip{display:inline-block;padding:0 8px;border-radius:10px;font-size:.75rem;color:#0c1208;vertical-align:middle}
.cur{border:2px solid var(--accent)}
.name{font-size:1.7rem;font-weight:700;line-height:1.2;margin:4px 0}
.big{font-size:3rem;font-weight:800;line-height:1.1}
.ends{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.nowbig{font-size:1.4rem;font-weight:600}.endbig{font-size:2.1rem;font-weight:800;line-height:1.1;text-align:right}
.late{color:var(--warn)}.early{color:var(--brk)}
.bar-wrap{position:relative;padding:4px 6px;margin:4px 0 8px}
.bar{display:flex;height:48px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.s{position:relative;height:100%;min-width:3px;overflow:hidden;border-right:1px solid var(--bg)}
.s.past{opacity:.4}.s.now{box-shadow:inset 0 0 0 3px var(--txt)}
.s.partial{background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.35) 0 3px,transparent 3px 6px)}
.s .fill{position:absolute;left:0;top:0;bottom:0;background:#000;opacity:.3}
.s.grey{background:repeating-linear-gradient(135deg,#3a3d40 0 4px,#2c2f32 4px 8px)!important}.s.rem{opacity:.55}
#preset{width:100%;text-overflow:ellipsis}.row input[type=checkbox]{width:26px;height:26px;margin:4px}
.mk{position:absolute;top:0;bottom:0;width:0;pointer-events:none}
.mk.nowm{border-left:2px solid var(--txt)}.mk.orig{border-left:2px dashed var(--mut)}.mk.endm{border-left:4px solid var(--accent)}
.mk.endm.late{border-left-color:var(--warn)}.mk.endm.early{border-left-color:var(--brk)}
.detail{background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.9rem}.detail:empty{display:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--mut);margin-top:6px}
.row{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row.dim{color:var(--mut)}
.row .main{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.row .tm{font-size:.85rem;color:var(--mut)}
.arrow{width:44px;min-height:44px;margin:0;padding:0}
.ed{padding:8px 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.ed label{display:flex;flex-direction:column;font-size:.75rem;color:var(--mut)}
#log{font:.8rem/1.5 monospace;white-space:pre-wrap;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{margin:0;border-radius:0;min-height:56px;background:transparent}
nav button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<div id="selftest" class="mut"></div>
<div id="setup" class="card">
  <h2>Start a run</h2>
  <label>Routine <select id="preset"></select></label><br>
  <label>Start time <input type="time" id="startT"></label>
  <div class="seg2" style="margin-top:8px"><button id="mReq" type="button">Required end time</button><button id="mOpen" type="button">Open-ended</button></div>
  <div id="reqBox">
    <label>Length <input type="number" id="lenH" min="0"> hr <input type="number" id="lenM" min="0"> min</label><br>
    <label>Ends at <input type="time" id="endT"></label>
  </div>
  <div id="openBox" class="mut"></div>
  <button class="pri" type="button" id="startBtn" style="margin-top:8px">Start run</button>
  <div id="setupErr" class="late"></div>
</div>
<div id="app"></div>
</div>
<nav id="nav" style="display:none"><button id="tRun" type="button">Run</button><button id="tEdit" type="button">Edit routine</button><button id="tTasks" type="button">Tasks</button></nav>
<script id="engine">
const ENGINE = (function () {
  const FLOOR_FRACTION = 0.8;   // min / est items compress to this share of their remaining time
  const GROW_WEIGHT_MIN = 5;    // buffers grow in proportion to max(default, this)
  const BUFFER_MIN_SHOW = 1;    // a buffer shorter than this (minutes) is not shown
  const EPS = 1e-9;

  const clone = o => JSON.parse(JSON.stringify(o));
  const sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);
  const isBuf = it => it.type === 'buf';
  const spentOf = (it, now) => it.spent + (it.status === 'active' ? Math.max(0, now - it.activeSince) : 0);
  // A block always gets its full planned length: time spent in earlier (pushed-forward) blocks is not credited.
  const baseRemaining = (it, now) => Math.max(0, it.dur - (it.status === 'active' ? Math.max(0, now - it.activeSince) : 0));
  const totalPlanned = s => sum(s.items, i => i.dur);
  // Required mode: the fixed end. Open mode: start + everything planned (moves when items are added or removed).
  const referenceEnd = s => s.mode === 'required' ? s.requiredEnd : s.start + totalPlanned(s);
  const activeItem = s => s.items.find(i => i.status === 'active') || null;
  const byId = (s, id) => s.items.find(i => i.id === id);

  function makeItem(s, spec) {
    s.nextId = (s.nextId || 0) + 1;
    const type = spec.type;
    return {
      id: 'i' + s.nextId, type, kind: type === 'buf' ? (spec.kind || 'task') : 'work',
      name: spec.name, dur: spec.dur, status: 'pending', spent: 0, activeSince: null, lockedEnd: null
    };
  }

  function createRun(cfg) {
    const s = { mode: cfg.mode, start: cfg.start, requiredEnd: cfg.mode === 'required' ? cfg.requiredEnd : null,
                items: [], history: [], nextId: 0, finished: false, free: null };
    cfg.items.forEach(spec => s.items.push(makeItem(s, spec)));
    return activateNext(s, cfg.start);
  }

  /* ---------- layout ----------
     Lays out every not-yet-finished item from `now`.
     Required: slack = (end - now) - work - buffer defaults.
       slack >= 0: buffers grow by weight max(default, 5), no cap. No buffers: saved time (free tail).
       slack <  0: buffers shrink in proportion to default, then items compress to 80%,
                   then the projected end runs past the required end.
     Open: same, except items never compress; past the buffers the projected end moves later.
     Buffers that would be shorter than BUFFER_MIN_SHOW disappear (the active one never does). */
  function layout(s, now) {
    const live = s.items.filter(i => i.status === 'pending' || i.status === 'active');
    const info = live.map(it => ({ it, base: baseRemaining(it, now), len: 0, hidden: false, live: true }));
    const fx = info.find(x => x.it.status === 'active' && x.it.lockedEnd !== null && x.it.lockedEnd !== undefined);
    if (fx) { fx.base = Math.max(0, fx.it.lockedEnd - now); fx.len = fx.base; }
    const W = info.filter(x => x !== fx && !isBuf(x.it));
    const B = info.filter(x => x !== fx && isBuf(x.it));
    const Wsum = sum(W, x => x.base);
    const ref = referenceEnd(s);
    const A = ref - now - (fx ? fx.len : 0);

    for (;;) {
      const liveB = B.filter(x => x.live);
      const Bdef = sum(liveB, x => x.base);
      const slack = A - Wsum - Bdef;
      W.forEach(x => { x.len = x.base; });
      if (slack >= 0) {
        if (liveB.length) {
          const wts = liveB.map(x => Math.max(x.base, GROW_WEIGHT_MIN));
          const wsum = sum(wts, w => w);
          liveB.forEach((x, i) => { x.len = x.base + slack * wts[i] / wsum; });
        }
      } else {
        const deficit = -slack;
        if (deficit <= Bdef + EPS) {
          liveB.forEach(x => { x.len = Bdef > EPS ? x.base * (1 - deficit / Bdef) : 0; });
        } else {
          liveB.forEach(x => { x.len = 0; });
          const d2 = deficit - Bdef;
          if (s.mode === 'required') {
            const comp = sum(W, x => (1 - FLOOR_FRACTION) * x.base);
            if (comp > EPS) {
              const f = Math.min(1, d2 / comp);
              W.forEach(x => { x.len = x.base - (1 - FLOOR_FRACTION) * x.base * f; });
            }
          }
        }
      }
      const tiny = liveB.filter(x => x.len < BUFFER_MIN_SHOW && x.it.status !== 'active');
      if (!tiny.length) break;
      tiny.forEach(x => { x.live = false; x.len = 0; x.hidden = true; });
    }

    let t = now;
    const blocks = info.map(x => {
      const start = t; t += x.len;
      const blk = { id: x.it.id, name: x.it.name, type: x.it.type, kind: x.it.kind, status: x.it.status,
               start, end: t, len: x.len, base: x.base, hidden: x.hidden };
      // Single chime when TOTAL time on a minimum item reaches its minimum (null if already reached)
      if (x.it.status === 'active') blk.minChimeAt = (x.it.type === 'min' && x.it.spent < x.it.dur - EPS) ? x.it.activeSince + (x.it.dur - x.it.spent) : null;
      return blk;
    });
    const projectedEnd = t;
    return {
      mode: s.mode, now, blocks, projectedEnd, referenceEnd: ref,
      overBy: Math.max(0, projectedEnd - ref),
      freeTail: Math.max(0, ref - projectedEnd),
      history: s.history.slice(),
      freeBlock: s.free ? { start: s.free.since, end: Math.max(ref, now) } : null,
      endReached: now >= ref - 0.05
    };
  }

  // Fixes the active block's end at the moment of an event; only events change it.
  function relock(s, now) {
    const a = activeItem(s); if (!a || now === undefined) return s;
    a.lockedEnd = null;
    const b = layout(s, now).blocks.find(x => x.id === a.id);
    a.lockedEnd = now + (b ? b.len : a.dur);
    return s;
  }

  /* ---------- events (each returns { state, error }) ---------- */
  function activateNext(s, now) {
    const lay = layout(s, now);
    let activated = false;
    for (const b of lay.blocks) {
      const it = byId(s, b.id);
      if (b.hidden) { it.status = 'skipped'; continue; }     // hidden buffers up to the next visible item are passed over
      it.status = 'active'; it.activeSince = now; relock(s, now); activated = true; break;
    }
    if (!activated) {
      s.items.forEach(i => { if (i.status === 'pending') i.status = 'skipped'; });
      if (now < referenceEnd(s) - 0.05) s.free = { since: now };   // saved time keeps running until exit or the end time
      else s.finished = true;
    }
    return s;
  }

  function finishRun(state, now) {
    const s = clone(state);
    if (!s.free) return { state: s, error: 'not in saved time' };
    s.history.push({ free: true, name: 'Saved time', from: s.free.since, to: now });
    s.free = null; s.finished = true;
    return { state: s, error: null };
  }

  function complete(state, now) {
    const s = clone(state);
    const act = activeItem(s);
    if (!act) return { state: s, error: 'no active item' };
    act.spent = spentOf(act, now);
    s.history.push({ id: act.id, name: act.name, from: act.activeSince, to: now, partial: false });
    act.status = 'done'; act.activeSince = null;
    activateNext(s, now);
    return { state: s, error: null };
  }

  // Skips the active item one position, for this run only. Time already spent stays on the
  // item (and on the timeline as a partial block) and counts against it when it comes up again.
  function pushForward(state, now) {
    const s = clone(state);
    const idx = s.items.findIndex(i => i.status === 'active');
    if (idx < 0) return { state: s, error: 'no active item' };
    const hidden = new Set(layout(s, now).blocks.filter(b => b.hidden).map(b => b.id));
    let j = -1;
    for (let k = idx + 1; k < s.items.length; k++) {
      if (s.items[k].status === 'pending' && !hidden.has(s.items[k].id)) { j = k; break; }
    }
    if (j < 0) return { state: s, error: 'nothing to push past' };
    const act = s.items[idx];
    act.spent = spentOf(act, now);
    s.history.push({ id: act.id, name: act.name, from: act.activeSince, to: now, partial: true });
    act.status = 'pending'; act.activeSince = null;
    for (let k = idx + 1; k < j; k++) if (s.items[k].status === 'pending') s.items[k].status = 'skipped';
    s.items.splice(idx, 1);          // target is now at j - 1
    s.items.splice(j, 0, act);       // pushed item lands right after it
    const target = s.items[j - 1];
    target.status = 'active'; target.activeSince = now; relock(s, now);
    return { state: s, error: null };
  }

  /* ---------- mid-run edits: only items that have not started ---------- */
  function frontier(s) {
    const k = s.items.findIndex(i => i.status === 'pending');
    return k < 0 ? s.items.length : k;
  }
  function addItem(state, spec, atIndex, now) {
    const s = clone(state);
    if (s.finished) return { state: s, error: 'run finished' };
    const idx = Math.max(atIndex === undefined ? s.items.length : atIndex, frontier(s));
    s.items.splice(Math.min(idx, s.items.length), 0, makeItem(s, spec));
    if (s.free) { s.history.push({ free: true, name: 'Saved time', from: s.free.since, to: now }); s.free = null; activateNext(s, now); } else relock(s, now);
    return { state: s, error: null };
  }
  function deleteItem(state, id, now) {
    const s = clone(state);
    const it = byId(s, id);
    if (!it) return { state: s, error: 'no such item' };
    if (it.status !== 'pending') return { state: s, error: 'only items not yet started can be deleted' };
    s.items = s.items.filter(i => i.id !== id); relock(s, now);
    return { state: s, error: null };
  }
  function moveItem(state, id, dir, now) {
    const s = clone(state);
    const k = s.items.findIndex(i => i.id === id);
    if (k < 0) return { state: s, error: 'no such item' };
    if (s.items[k].status !== 'pending') return { state: s, error: 'only items not yet started can be moved' };
    const k2 = k + (dir < 0 ? -1 : 1);
    if (k2 >= 0 && s.items[k2] && s.items[k2].status === 'active') {   // Up on the first waiting item = push forward
      if (dir >= 0 || now === undefined) return { state: s, error: 'cannot move there' };
      const r = pushForward(state, now);
      return (r.error || activeItem(r.state).id !== id) ? { state: s, error: r.error || 'cannot move there' } : r;
    }
    if (k2 < 0 || k2 >= s.items.length || s.items[k2].status !== 'pending') return { state: s, error: 'cannot move there' };
    [s.items[k], s.items[k2]] = [s.items[k2], s.items[k]]; relock(s, now);
    return { state: s, error: null };
  }
  // patch may hold name, dur; type/kind only for items not yet started. The active item keeps its time spent.
  function updateItem(state, id, patch, now) {
    const s = clone(state);
    const it = byId(s, id);
    if (!it) return { state: s, error: 'no such item' };
    if (it.status !== 'pending' && it.status !== 'active') return { state: s, error: 'finished items cannot be edited' };
    if (patch.name !== undefined) it.name = patch.name;
    if (patch.dur !== undefined) it.dur = patch.dur;
    if (it.status === 'pending') {
      if (patch.type !== undefined) it.type = patch.type;
      if (patch.kind !== undefined) it.kind = patch.kind;
      it.kind = it.type === 'buf' ? (it.kind === 'break' ? 'break' : 'task') : 'work';
    }
    relock(s, now);
    return { state: s, error: null };
  }

  /* ---------- readable dump ---------- */
  const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
  function describe(lay, s) {
    const lines = [];
    (s ? s.history : lay.history).forEach(h => lines.push(`  past   ${h.name}: ${f1(h.from)} to ${f1(h.to)}${h.partial ? ' (partial, pushed)' : ''}`));
    lay.blocks.forEach(b => {
      if (b.hidden) { lines.push(`  hidden ${b.name} (${b.kind})`); return; }
      lines.push(`  ${b.status === 'active' ? 'now   ' : 'next  '} ${b.name}${b.type === 'buf' ? ' [' + b.kind + ' buffer]' : ''}: ${f1(b.start)} to ${f1(b.end)} (${f1(b.len)} min)`);
    });
    lines.push(`  projected end ${f1(lay.projectedEnd)}, reference end ${f1(lay.referenceEnd)}` +
      (lay.overBy > 1e-6 ? `, OVER by ${f1(lay.overBy)}` : '') + (lay.freeTail > 1e-6 ? `, saved tail ${f1(lay.freeTail)}` : ''));
    return lines.join('\n');
  }

  return { createRun, layout, complete, finishRun, pushForward, addItem, deleteItem, moveItem, updateItem,
           activeItem, describe, constants: { FLOOR_FRACTION, GROW_WEIGHT_MIN, BUFFER_MIN_SHOW } };
})();
</script>
<script id="tests">
function runAllTests() {
  const E = ENGINE;
  const results = [];
  const f2 = n => (Math.round(n * 100) / 100).toString();

  function scenario(title, desc, fn) {
    const checks = [], notes = [];
    const c = {
      near(label, got, want, tol) { checks.push({ label, got: f2(got), want: f2(want), pass: Math.abs(got - want) <= (tol === undefined ? 0.01 : tol) }); },
      eq(label, got, want) { checks.push({ label, got: String(got), want: String(want), pass: got === want }); },
      ok(label, cond) { checks.push({ label, got: String(!!cond), want: 'true', pass: !!cond }); },
      note(t) { notes.push(t); }
    };
    try { fn(c); } catch (e) { checks.push({ label: 'scenario threw an error', got: String(e && e.message || e), want: 'no error', pass: false }); }
    results.push({ title, desc, checks, notes, pass: checks.every(x => x.pass) });
  }

  // 60 minutes planned: Cleanup 10 (min), Pack lunch 20 (est), task buffer 10, Make bed 15 (est), break buffer 5.
  const routineR = () => [
    { type: 'min', name: 'Cleanup', dur: 10 },
    { type: 'est', name: 'Pack lunch', dur: 20 },
    { type: 'buf', kind: 'task', name: 'Task buffer', dur: 10 },
    { type: 'est', name: 'Make bed', dur: 15 },
    { type: 'buf', kind: 'break', name: 'Break buffer', dur: 5 }
  ];
  const L = (lay, name) => lay.blocks.find(b => b.name === name);
  const names = s => s.items.map(i => i.name + (i.status === 'pending' ? '' : ':' + i.status)).join(' | ');
  const req = () => E.createRun({ items: routineR(), mode: 'required', start: 0, requiredEnd: 60 });
  const open = () => E.createRun({ items: routineR(), mode: 'open', start: 0 });
  const done = (s, t) => E.complete(s, t).state;

  scenario('1. On time, required end',
    'Everything finishes exactly as planned: items and buffers stay at their defaults and the end is 60.', c => {
    let s = req(), lay = E.layout(s, 0);
    c.eq('first item is active', E.activeItem(s).name, 'Cleanup');
    c.near('projected end at start', lay.projectedEnd, 60);
    s = done(s, 10); lay = E.layout(s, 10);
    c.eq('Pack lunch is active', E.activeItem(s).name, 'Pack lunch');
    c.near('Pack lunch length', L(lay, 'Pack lunch').len, 20);
    c.near('task buffer', L(lay, 'Task buffer').len, 10);
    c.near('break buffer', L(lay, 'Break buffer').len, 5);
    c.near('projected end', lay.projectedEnd, 60);
    c.note(E.describe(lay, s));
  });

  scenario('2. Early finish, required end, with buffers',
    'Cleanup done 4 min early. The 4 spare minutes go to the buffers, weighted 10 : 5.', c => {
    let s = done(req(), 6); const lay = E.layout(s, 6);
    c.near('Pack lunch stays at 20', L(lay, 'Pack lunch').len, 20);
    c.near('Make bed stays at 15', L(lay, 'Make bed').len, 15);
    c.near('task buffer grows', L(lay, 'Task buffer').len, 10 + 4 * 10 / 15);
    c.near('break buffer grows', L(lay, 'Break buffer').len, 5 + 4 * 5 / 15);
    c.near('projected end', lay.projectedEnd, 60);
    c.near('no saved tail', lay.freeTail, 0);
    c.note(E.describe(lay, s));
  });

  scenario('3. Small overrun absorbed by buffers only',
    'Cleanup done 4 min late. Buffers shrink in proportion to their defaults; items stay full length.', c => {
    let s = done(req(), 14); const lay = E.layout(s, 14);
    c.near('Pack lunch stays at 20', L(lay, 'Pack lunch').len, 20);
    c.near('task buffer', L(lay, 'Task buffer').len, 10 * (1 - 4 / 15));
    c.near('break buffer', L(lay, 'Break buffer').len, 5 * (1 - 4 / 15));
    c.near('projected end', lay.projectedEnd, 60);
    c.note(E.describe(lay, s));
  });

  scenario('4. Bigger overrun: buffers vanish, items compress',
    'Cleanup done 20 min late. Both buffers disappear and the two estimate items shrink, but stay above 80%.', c => {
    let s = done(req(), 30); const lay = E.layout(s, 30);
    c.ok('task buffer hidden', L(lay, 'Task buffer').hidden);
    c.ok('break buffer hidden', L(lay, 'Break buffer').hidden);
    c.near('Pack lunch', L(lay, 'Pack lunch').len, 20 - 4 * (5 / 7));
    c.near('Make bed', L(lay, 'Make bed').len, 15 - 3 * (5 / 7));
    c.ok('Pack lunch at least 80%', L(lay, 'Pack lunch').len >= 16 - 1e-9);
    c.near('projected end', lay.projectedEnd, 60);
    c.note(E.describe(lay, s));
  });

  scenario('5. Overrun too big even for the 80% floors',
    'Cleanup done 30 min late. Items sit at their floors and the projected end runs past the required end.', c => {
    let s = done(req(), 40); const lay = E.layout(s, 40);
    c.near('Pack lunch at floor', L(lay, 'Pack lunch').len, 16);
    c.near('Make bed at floor', L(lay, 'Make bed').len, 12);
    c.near('over by', lay.overBy, 8);
    c.near('projected end', lay.projectedEnd, 68);
    c.note(E.describe(lay, s));
  });

  scenario('6. Late, then caught up (full reversal), required end',
    'Cleanup 4 late, then Pack lunch 4 early. Buffers return exactly to their defaults.', c => {
    let s = done(req(), 14);
    let lay = E.layout(s, 14);
    c.near('after the delay, task buffer is shrunk', L(lay, 'Task buffer').len, 10 * (1 - 4 / 15));
    s = done(s, 30); lay = E.layout(s, 30);
    c.near('task buffer back to default', L(lay, 'Task buffer').len, 10);
    c.near('break buffer back to default', L(lay, 'Break buffer').len, 5);
    c.near('Make bed full length', L(lay, 'Make bed').len, 15);
    c.near('projected end', lay.projectedEnd, 60);
    c.note(E.describe(lay, s));
  });

  scenario('7. Open-ended: late, then catching up',
    'Open end, suggested 60. Buffers shrink first; past that the end moves later; catching up brings the end back, then buffers regrow.', c => {
    let s = open(), lay = E.layout(s, 0);
    c.near('suggested end', lay.referenceEnd, 60);
    let a = done(s, 14); lay = E.layout(a, 14);
    c.near('4 late: end unchanged', lay.projectedEnd, 60);
    c.near('4 late: task buffer shrinks', L(lay, 'Task buffer').len, 10 * (1 - 4 / 15));
    a = done(s, 30); lay = E.layout(a, 30);
    c.ok('20 late: buffers gone', L(lay, 'Task buffer').hidden && L(lay, 'Break buffer').hidden);
    c.near('20 late: items not compressed', L(lay, 'Pack lunch').len, 20);
    c.near('20 late: end moves later', lay.projectedEnd, 65);
    c.near('20 late: over by', lay.overBy, 5);
    // Pack lunch then finishes at 40 (10 min early): the end returns to 60 and buffers partly return.
    let b = done(a, 40); lay = E.layout(b, 40);
    c.near('then 10 early: end back to original', lay.projectedEnd, 60);
    c.near('then 10 early: task buffer partly back', L(lay, 'Task buffer').len, 10 * (1 - 10 / 15));
    // Ahead of schedule from the start: buffers grow, end stays 60.
    const e = done(s, 5); lay = E.layout(e, 5);
    c.near('5 early: task buffer grows', L(lay, 'Task buffer').len, 10 + 5 * 10 / 15);
    c.near('5 early: end stays', lay.projectedEnd, 60);
    c.note(E.describe(lay, e));
  });

  scenario('8. No buffers, ahead of schedule',
    'Two items, 30 planned. Cleanup done 4 early: the end moves earlier and the saved time is shown at the end.', c => {
    const items = [{ type: 'min', name: 'Cleanup', dur: 10 }, { type: 'est', name: 'Pack lunch', dur: 20 }];
    ['required', 'open'].forEach(mode => {
      const s = E.createRun({ items, mode, start: 0, requiredEnd: 30 });
      const t = done(s, 6), lay = E.layout(t, 6);
      c.near(mode + ': projected end moves earlier', lay.projectedEnd, 26);
      c.near(mode + ': saved tail', lay.freeTail, 4);
      c.near(mode + ': reference end', lay.referenceEnd, 30);
      if (mode === 'open') c.note(E.describe(lay, t));
    });
  });

  scenario('9. Push forward',
    'Skip the current item for this run only. Time spent stays on it and counts when it returns.', c => {
    const items = [{ type: 'min', name: 'Cleanup', dur: 10 }, { type: 'est', name: 'Pack lunch', dur: 20 }, { type: 'est', name: 'Make bed', dur: 15 }];
    let s = E.createRun({ items, mode: 'open', start: 0 });
    let r = E.pushForward(s, 4); s = r.state;

    c.eq('Pack lunch now active', E.activeItem(s).name, 'Pack lunch');
    c.eq('order', names(s), 'Pack lunch:active | Cleanup | Make bed');
    c.eq('partial block recorded', s.history.length === 1 && s.history[0].partial && s.history[0].from === 0 && s.history[0].to === 4, true);
    let lay = E.layout(s, 4);

    c.near('Cleanup starts after Pack lunch', L(lay, 'Cleanup').start, 24);

    let s = E.createRun({ items, mode: 'required', start: 0, requiredEnd: 30 });

    c.eq('no error', r.error, null);

    c.near('delete Make bed: break buffer grows', L(lay, 'Break buffer').len, 5 + 19 * 5 / 15);

  scenario('10b. Mid-run edits, open end',

  scenario('11. Tight run to the finish',

    let s = done(req(), 30);
    let lay = E.layout(s, 30);
    const t1 = 30 + L(lay, 'Pack lunch').len;
    s = done(s, t1); lay = E.layout(s, t1);

    c.near('Make bed length', L(lay, 'Make bed').len, 90 / 7);

  });

  scenario('12. Sweep: Cleanup done at every minute 0 to 60',
    'Invariants for the required end: lengths never negative, end holds unless over, buffer total only falls as time is lost.', c => {
    let bad = [], prevBuf = Infinity, monotone = true, tailWithBuf = false;
    for (let t = 0; t <= 60; t++) {
      const s = done(req(), t); const lay = E.layout(s, t);
      if (s.finished) continue;

      if (lay.overBy < 1e-6 && lay.freeTail < 1e-6 && Math.abs(lay.projectedEnd - 60) > 1e-6) bad.push('end drifted at ' + t);
      if (lay.overBy > 1e-6 && lay.projectedEnd < 60) bad.push('over flag wrong at ' + t);
      const bufTotal = lay.blocks.filter(b => b.type === 'buf').reduce((a, b) => a + b.len, 0);
      if (bufTotal > prevBuf + 1e-6) monotone = false;
      prevBuf = bufTotal;
      if (lay.freeTail > 1e-6 && lay.blocks.some(b => b.type === 'buf' && !b.hidden)) tailWithBuf = true;
    }
    c.eq('no invariant violations', bad.join('; ') || 'none', 'none');
    c.ok('buffer total never grows as completion time gets later', monotone);
    c.ok('saved tail only appears when no buffer is showing', !tailWithBuf);
  });

  scenario('13. Pushed items, minimum chime, saved time',
    'Pushed items return at full length; minimum chime uses total time; leftover time keeps running as saved time.', c => {
    const items = [{ type: 'min', name: 'Cleanup', dur: 10 }, { type: 'est', name: 'Pack lunch', dur: 20 }];
    let s = E.createRun({ items, mode: 'open', start: 0 });
    s = E.pushForward(s, 12).state;
    c.near('returns at full length although 12 > 10 min were spent', L(E.layout(s, 12), 'Cleanup').len, 10);
    s = done(s, 32);
    c.eq('Cleanup active again', E.activeItem(s).name, 'Cleanup');
    c.eq('no minimum chime: minimum already reached', L(E.layout(s, 32), 'Cleanup').minChimeAt, null);
    let t = E.pushForward(E.createRun({ items, mode: 'open', start: 0 }), 4).state; t = done(t, 24);
    const lt = E.layout(t, 24);
    c.near('chime when TOTAL reaches the minimum', L(lt, 'Cleanup').minChimeAt, 30);
    c.near('block still ends after a full 10 min', L(lt, 'Cleanup').end, 34);
    const one = () => E.createRun({ items: [{ type: 'est', name: 'A', dur: 10 }], mode: 'required', start: 0, requiredEnd: 20 });
    const u = done(one(), 6);
    c.eq('keeps running in saved time', u.finished === false && u.free !== null, true);
    c.near('saved block runs to the end time', E.layout(u, 8).freeBlock.end, 20);
    c.eq('adding an item starts it', E.activeItem(E.addItem(u, { type: 'est', name: 'B', dur: 5 }, undefined, 8).state).name, 'B');
    c.eq('finish from saved time', E.finishRun(u, 10).state.finished, true);
    c.eq('completing at the end time finishes the run', done(one(), 20).finished, true);
  });

  scenario('14. Locked block ends: the clock alone never reshuffles',
    'Active buffer keeps its end while the clock runs; only events (or overrunning the whole block) change plans.', c => {
    const mk = end => E.createRun({ items: [{ type: 'min', name: 'Cleanup', dur: 10 }, { type: 'buf', kind: 'task', name: 'Buf', dur: 10 }, { type: 'est', name: 'Pack', dur: 20 }], mode: 'required', start: 0, requiredEnd: end });
    let s = done(mk(60), 6);
    [6, 12, 25, 39].forEach(t => { const lay = E.layout(s, t); c.near('growing buffer end at ' + t, L(lay, 'Buf').end, 40); c.near('Pack start at ' + t, L(lay, 'Pack').start, 40); });
    s = done(mk(35), 10);
    [10, 12, 15].forEach(t => c.near('shrunk buffer end at ' + t, L(E.layout(s, t), 'Buf').end, 15));
    c.near('Pack unchanged by the clock', L(E.layout(s, 14), 'Pack').len, 20);
    const lay = E.layout(s, 20);
    c.near('overrun: buffer length 0', L(lay, 'Buf').len, 0);
    c.near('overrun: Pack at floor', L(lay, 'Pack').len, 16);
    c.near('overrun: over by', lay.overBy, 1);
    const s2 = done(mk(60), 10), id = s2.items[2].id;
    c.near('delete Pack at 20: buffer re-locked to 60', L(E.layout(E.deleteItem(s2, id, 20).state, 20), 'Buf').end, 60);
    c.near('Pack to 30 min at 20: buffer re-locked to 30', L(E.layout(E.updateItem(s2, id, { dur: 30 }, 20).state, 20), 'Buf').end, 30);
  });

  return results;
}

<script id="ui">
const E = ENGINE, $ = id => document.getElementById(id);
const CLOCK_24H = false;

const pad = n => String(n).padStart(2, '0');
const PRESETS = {

    { type: 'buf', kind: 'task', name: 'Task buffer', dur: 10 }, { type: 'est', name: 'Make bed', dur: 15 },
    { type: 'buf', kind: 'break', name: 'Break buffer', dur: 5 } ] },
  nobuf: { label: 'No buffers (30 min)', items: [{ type: 'min', name: 'Cleanup', dur: 10 }, { type: 'est', name: 'Pack lunch', dur: 20 }] },
  morning: { label: 'Longer morning (75 min)', items: [
    { type: 'est', name: 'Brush teeth', dur: 5 }, { type: 'est', name: 'Make bed', dur: 5 }, { type: 'min', name: 'House cleanup', dur: 15 },
    { type: 'est', name: 'Pack lunch', dur: 15 }, { type: 'buf', kind: 'task', name: 'Habits and tasks', dur: 10 }, { type: 'min', name: 'Flashcards', dur: 15 },
    { type: 'buf', kind: 'break', name: 'Break', dur: 5 }, { type: 'est', name: 'Shoes and keys', dur: 5 }, { type: 'buf', kind: 'task', name: 'Extra buffer (0 default)', dur: 0 } ] }
};
const total = k => PRESETS[k].items.reduce((a, i) => a + i.dur, 0);
let BP = null, SKIP = new Set(), RUNMOM = 0, HE = null, HD = null, HDEL = null;
let state = null, now = 0, base = 0, undo = [], tab = 'run', open = null, segs = [], log = [], resetPending = false, mode = 'required';

function clock(m) { let t = Math.floor(((base + m) % 1440 + 1440) % 1440 + 1e-6); let h = Math.floor(t / 60), mi = t % 60;
  if (!CLOCK_24H) { h = h % 12 || 12; return h + ':' + pad(mi); } return pad(h) + ':' + pad(mi); }
const hm = s => { const p = (s || '').split(':'); return p.length === 2 ? (+p[0]) * 60 + (+p[1]) : NaN; };
const toHM = m => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ':' + pad(Math.round(((m % 1440) + 1440) % 1440) % 60);
const mmss = m => { const s = Math.round(Math.max(0, m) * 60); return Math.floor(s / 60) + ':' + pad(s % 60); };
const colorFor = it => it.type === 'min' ? 'var(--min)' : it.type === 'est' ? 'var(--est)' : it.kind === 'break' ? 'var(--brk)' : 'var(--task)';
const typeLabel = it => it.type === 'min' ? 'Minimum' : it.type === 'est' ? 'Estimate' : it.kind === 'break' ? 'Break buffer' : 'Task buffer';
const chip = it => `<span class="chip" style="background:${colorFor(it)}">${typeLabel(it)}</span>`;
const itemById = id => state && state.items.find(i => i.id === id);

/* ---------- setup ---------- */
$('preset').innerHTML = Object.keys(PRESETS).map(k => `<option value="${k}">${esc(PRESETS[k].label)}</option>`).join('');
const now0 = new Date(); $('startT').value = pad(now0.getHours()) + ':' + pad(now0.getMinutes());
function setLen(len) { $('lenH').value = Math.floor(len / 60); $('lenM').value = len % 60; }
function lenNow() { return (+$('lenH').value || 0) * 60 + (+$('lenM').value || 0); }
function syncEnd() { $('endT').value = toHM(hm($('startT').value) + lenNow()); syncOpen(); }
function syncOpen() { const t = total($('preset').value); $('openBox').textContent = `Suggested length ${t} min, so a ${$('startT').value} start ends ${toHM(hm($('startT').value) + t)}. Tap Start run to begin.`; }
function setMode(m) { mode = m; $('mReq').className = m === 'required' ? 'on' : ''; $('mOpen').className = m === 'open' ? 'on' : '';
  $('reqBox').style.display = m === 'required' ? 'block' : 'none'; $('openBox').style.display = m === 'open' ? 'block' : 'none'; syncOpen(); }
$('preset').onchange = () => { setLen(total($('preset').value)); syncEnd(); };
$('startT').onchange = syncEnd; $('lenH').oninput = $('lenM').oninput = syncEnd;
$('endT').onchange = () => { const d = ((hm($('endT').value) - hm($('startT').value)) % 1440 + 1440) % 1440; setLen(d); };
$('mReq').onclick = () => setMode('required'); $('mOpen').onclick = () => setMode('open');
$('startBtn').onclick = () => {
  const s = hm($('startT').value); const len = lenNow();
  if (isNaN(s)) { $('setupErr').textContent = 'Set a start time.'; return; }
  if (mode === 'required' && len <= 0) { $('setupErr').textContent = 'Set a length greater than 0.'; return; }
  $('setupErr').textContent = ''; base = s; now = 0; undo = []; log = []; open = null; tab = 'run'; BP = null; SKIP = new Set(); RUNMOM = 0;

setLen(total('test')); setMode('required'); syncEnd();

/* ---------- actions ---------- */
function snap() { captureHE(); undo.push({ state: clone(state), now, log: log.slice(), bp: clone(BP), skip: [...SKIP], tasks: clone(TASKS), habits: clone(HABITS), day: DAY, mom: RUNMOM }); if (undo.length > 100) undo.shift(); }
function doUndo() { if (!undo.length) return; const u = undo.pop(); state = u.state; now = u.now; log = u.log; BP = u.bp; SKIP = new Set(u.skip); TASKS = u.tasks; HABITS = u.habits; DAY = u.day; RUNMOM = u.mom; render(); }

function advance(dt) {
  if (!state || state.finished) return; snap();

}

}
const go = t => { tab = t; render(); };
function pick(i) { const s = segs[i]; if (!s) return; let x;
  if (s.free) x = `Saved time ${clock(s.from)} to ${clock(s.to)}, ${fm(s.to - s.from)} min.`;
  else { const it = s.it; x = `${s.sub || it.name}. ` + (s.past ? `${s.partial ? 'Pushed forward after' : 'Done after'} ${fm(s.to - s.from)} min, ${clock(s.from)} to ${clock(s.to)}.` : s.now ? `Running since ${clock(s.from)}, ${fm(s.elapsed)} min so far.` : `${clock(s.from)} to ${clock(s.to)}, ${fm(s.to - s.from)} min.`);
    const pl = PLANS[it.id]; if (!s.past && !s.sub && pl && pl.length) x += ' Suggested: ' + pl.map(t => t.name).join(', ') + '.'; }
  if (s.sub && s.it.lockedEnd != null) x += ' Buffer ends ' + clock(s.it.lockedEnd) + '.';
  if (s.bufEnd != null) x += ' Task buffer ends ' + clock(s.bufEnd) + '.';
  $('detail').textContent = x; }
function resetRun() { if (!resetPending) { resetPending = true; render(); setTimeout(() => { resetPending = false; if (state) render(); }, 4000); return; } resetPending = false; state = null; render(); }

/* ---------- render ---------- */
function runView(lay) {

  let cur;
  if (state.finished) { const last = state.history[state.history.length - 1]; cur = `<div class="card cur"><h2>Routine complete</h2><div class="name">Finished at ${clock(last ? last.to : now)}</div><div class="mut">Planned end ${clock(ref)}.</div></div>`; }
  else if (state.free) { const left = Math.max(0, ref - now);
    cur = `<div class="card cur"><span class="chip" style="background:var(--brk)">Saved time</span><div class="name">Nothing scheduled</div><div class="big">${left > 0 ? mmss(left) : 'End time reached'}</div><div class="mut">${left > 0 ? 'left until the end time. Add an item on the Edit tab, or finish.' : 'The routine can be finished now.'}</div><button class="pri" style="min-height:56px;width:100%" onclick="apply(()=>E.finishRun(state,now))">Finish routine</button></div>`; }
  else if (act.type === 'buf' && act.kind === 'task') { cur = taskBufferCard(act, b); }

    return `<div class="row${h.paused ? ' dim' : ''}" style="border-left:3px solid ${h.paused ? '#777' : col[s.status]};padding-left:8px"><div class="main"><div>${esc(h.name)}</div><div class="tm">${freq(h)} · ${h.dur} min · ${h.paused ? 'paused' : s.showing ? 'score ' + Math.round(hUrg(h, s) + hImp(h, s) * 15) : 'not due'}</div></div><div>${bx}</div><button onclick="openHE(${h.id})">Edit</button></div>${HE === h.id ? heHTML(h) : ''}`; }).join('');
  const tr = TASKS.slice().sort((a, b) => (sorted(b) ? b.urg + b.imp * 15 : -1) - (sorted(a) ? a.urg + a.imp * 15 : -1) || a.id - b.id).map(t =>
    `<div class="row${t.checked ? ' dim' : ''}"><input type="checkbox" ${t.checked ? 'checked' : ''} onchange="taskToggle(${t.id},this.checked)"><div class="main"><div>${esc(t.name)}</div><div class="tm">${sorted(t) ? t.dur + ' min · ' + t.utype + ' · score ' + (t.urg + t.imp * 15) : 'not sorted yet'}</div></div></div>`).join('');
  return `<div class="card"><h2>Habits</h2><button onclick="openHE('new')">+ New habit</button>${hr}<div class="mut" style="margin-top:6px">Day ${DAY} <button onclick="nextDay()">New day</button></div></div>`
    + `<div class="card"><h2>Tasks</h2>${sortCard()}${tr}<div class="ed" style="border-top:1px solid var(--line);margin-top:6px"><label>New task<input id="tkName" style="width:200px" onkeydown="if(event.key==='Enter')addTaskUI()"></label><button class="pri" onclick="addTaskUI()">Add</button></div></div>`;
}
/* ---------- edit tab ---------- */
let isNew = null;
function setF() {}
function tapItem(id) { open = open === id ? null : id; isNew = null; render(); }
function saveEdit(id) {
  const p = { name: $('edName').value.trim() || 'Item', dur: Math.max(0, parseFloat($('edDur').value) || 0) };
  if ($('edType')) { const v = $('edType').value; Object.assign(p, v.startsWith('buf:') ? { type: 'buf', kind: v.slice(4) } : { type: v }); }
  open = null; isNew = null; apply(() => E.updateItem(state, id, p, now));
}
function cancelEdit(id) { const n = isNew === id; open = null; isNew = null; if (n) apply(() => E.deleteItem(state, id, now)); else render(); }
function addNew() { apply(() => E.addItem(state, { type: 'est', name: 'New item', dur: 5 }, undefined, now)); if (state) { open = state.items[state.items.length - 1].id; isNew = open; } render(); }
function editView(lay) {
  const rows = state.items.map(it => { const b = lay.blocks.find(x => x.id === it.id), pend = it.status === 'pending';
    let tm; const h = [...state.history].reverse().find(x => x.id === it.id && !x.partial);
    if (it.status === 'done') tm = h ? `${clock(h.from)}-${clock(h.to)} · ${fm(h.to - h.from)} min` : 'done';
    else if (it.status === 'skipped') tm = 'skipped'; else if (b && b.hidden) tm = 'no room right now';
    else tm = it.status === 'active' ? `now, to ${clock(b.end)} · ${fm(b.len)} min left` : `${clock(b.start)}-${clock(b.end)} · ${fm(b.len)} min`;
    const pl = PLANS[it.id]; if (pl && pl.length) tm += ' · ' + pl.map(t => t.name).join(', ');
    const ed = open === it.id && (pend || it.status === 'active') ? `<div class="ed"><label>Name<input id="edName" value="${esc(it.name)}"></label>`
      + (pend ? `<label>Type<select id="edType">${[['est', 'Estimate'], ['min', 'Minimum'], ['buf:task', 'Task buffer'], ['buf:break', 'Break buffer']].map(([v, l]) => `<option value="${v}"${(it.type === 'buf' ? 'buf:' + it.kind : it.type) === v ? ' selected' : ''}>${l}</option>`).join('')}</select></label>` : '')
      + `<label>Minutes<input id="edDur" type="number" min="0" value="${it.dur}"></label><button class="pri" onclick="saveEdit('${it.id}')">Save</button><button onclick="cancelEdit('${it.id}')">Cancel</button>${pend ? `<button onclick="itemAct('del','${it.id}')">Delete</button>` : ''}</div>` : '';
    return `<div class="row${pend || it.status === 'active' ? '' : ' dim'}">${pend ? `<button class="arrow" aria-label="Move up" onclick="itemAct('up','${it.id}')">&#9650;</button><button class="arrow" aria-label="Move down" onclick="itemAct('down','${it.id}')">&#9660;</button>` : '<span style="width:92px"></span>'}`
      + `<div class="main" onclick="tapItem('${it.id}')"><div>${esc(it.name)} ${chip(it)}</div><div class="tm">${tm}</div></div></div>${ed}`; }).join('');
  const pe = lay.projectedEnd, ref = lay.referenceEnd, differs = !state.finished && !state.free && Math.abs(pe - ref) > 0.5;
  return `<div class="card"><h2>Items</h2>${rows}<button onclick="addNew()" style="margin-top:8px"${state.finished ? ' disabled' : ''}>+ Add item</button></div>`
    + `<div class="card"><h2>${state.mode === 'required' ? 'Required' : 'Suggested'} end ${clock(ref)}</h2>${differs ? `<div style="font-size:1.05rem">Expected end ${clock(pe)}</div>` : ''}</div>`;
}

function render() {
  $('setup').style.display = state ? 'none' : 'block'; $('nav').style.display = state ? 'grid' : 'none';
  if (!state) { $('app').innerHTML = ''; return; }
  ensureBP(); const lay = E.layout(state, now); PLANS = bufferPlans(lay);
  $('tRun').className = tab === 'run' ? 'on' : ''; $('tEdit').className = tab === 'edit' ? 'on' : ''; $('tTasks').className = tab === 'tasks' ? 'on' : '';
  $('app').innerHTML = (flashMsg ? `<div class="card late">${esc(flashMsg)}</div>` : '') + (tab === 'run' ? runView(lay) : tab === 'edit' ? editView(lay) : tasksView()); flashMsg = '';
}
$('tRun').onclick = () => go('run'); $('tEdit').onclick = () => go('edit'); $('tTasks').onclick = () => go('tasks');
{ const r = runAllTests(), p = r.filter(x => x.pass).length; $('selftest').textContent = `Engine scenarios: ${p} of ${r.length} pass`; }
</script>
</body>
